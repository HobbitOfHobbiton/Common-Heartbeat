; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hardbeatz

[env:hardbeatz]
; Single combined firmware: heartbeat sensor + drum-strike motor on one board.
platform = espressif32
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.3
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.3/esp32-arduino-libs-3.0.3.zip
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200
; Shared module (motor + phase-lock + heartbeat contract) lives in src/shared/;
; put it on the include path so its headers resolve by bare name from anywhere.
build_flags =
  ; -I src/shared
  ; Demo/showcase mode: ignore GPIO13 and synthesize a steady heartbeat (no sensor
  ; needed). Uncomment to enable; optionally set the tempo (defaults to 80 BPM).
  ; -D HEARTBEAT_DEMO            ; enable synthetic beat at 80 BPM
  ; -D HEARTBEAT_DEMO_BPM=90     ; (optional) override the default tempo
; Build only the top-level combined firmware (incl. src/shared/). src/Wireless/
; holds the old ESP-NOW sender/receiver split, kept as a fallback — exclude it
; so its setup()/loop() don't clash with main.cpp.
build_src_filter = +<*> -<Wireless/>
lib_deps =
  waspinator/AccelStepper@^1.64
  teemuatlut/TMCStepper@^0.7.3
  ; Optional debug OLED (SSD1306 128x64 I2C); auto-detected at boot, linked on
  ; all units but only used where a panel is wired. Pulls Adafruit BusIO too.
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
